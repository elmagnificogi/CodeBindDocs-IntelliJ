name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Check tag matches pluginVersion
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(grep '^pluginVersion=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')"
          echo "tag=$TAG gradle.properties=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Git tag v$TAG must match pluginVersion $PKG in gradle.properties"
            exit 1
          fi

      - name: Test and package
        run: ./gradlew --no-daemon check buildPlugin

      - name: Publish to JetBrains Marketplace
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$PUBLISH_TOKEN" ]; then
            echo "No PUBLISH_TOKEN secret; skip Marketplace publish (GitHub Release still proceeds)."
            exit 0
          fi
          echo "Publishing to JetBrains Marketplace"
          ./gradlew --no-daemon publishPlugin

      - name: Prepare release notes from CHANGELOG
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_VER="${GITHUB_REF_NAME#v}"
          awk -v ver="$TAG_VER" '
            { sub(/\r$/, "") }
            $0 ~ ("^## " ver "$") { p=1; print; next }
            p && /^## / { exit }
            p { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CodeBind Docs ${GITHUB_REF_NAME}" > release-notes.md
            echo "" >> release-notes.md
            echo "- GitHub Release (plugin zip)" >> release-notes.md
          fi
          {
            echo ""
            echo "---"
            echo ""
            echo "Install from disk: Settings → Plugins → gear → Install Plugin from Disk, then pick the zip attached to this release."
          } >> release-notes.md
          cat release-notes.md

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ZIP="$(ls -1 build/distributions/*.zip | head -n1)"
          echo "Attaching $ZIP"
          gh release create "$GITHUB_REF_NAME" "$ZIP" \
            --title "CodeBind Docs ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            --verify-tag

      - name: Upload plugin zip
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: plugin-distribution
          path: build/distributions/*.zip
          if-no-files-found: error
